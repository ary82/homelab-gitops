apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: ezbookkeeping
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage
  namespace: ezbookkeeping
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 4Gi
