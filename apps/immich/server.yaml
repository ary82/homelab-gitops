apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      enableServiceLinks: false
      containers:
      - name: server
        image: ghcr.io/immich-app/immich-server:v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
        envFrom:
        - configMapRef:
            name: immich-config
        - secretRef:
            name: immich-secret
        ports:
        - containerPort: 2283
        readinessProbe:
          httpGet:
            path: /api/server/ping
            port: 2283
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /api/server/ping
            port: 2283
          failureThreshold: 30
          periodSeconds: 10
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 2Gi
        volumeMounts:
        - name: library
          mountPath: /data
      volumes:
      - name: library
        persistentVolumeClaim:
          claimName: library
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
spec:
  selector:
    app: immich-server
  ports:
  - port: 2283
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
  namespace: immich
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  rules:
  - host: immich.sb.ary82.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: immich-server
            port:
              number: 2283
  tls:
  - hosts:
    - immich.sb.ary82.dev
