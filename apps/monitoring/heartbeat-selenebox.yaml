apiVersion: batch/v1
kind: CronJob
metadata:
  name: heartbeat-selenebox
  namespace: monitoring
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 60
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: selenebox
          containers:
          - name: ping
            image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
            env:
            - name: HEARTBEAT_URL
              valueFrom:
                secretKeyRef:
                  name: healthchecks
                  key: HEARTBEAT_URL_SELENEBOX
            command:
            - "sh"
            - "-c"
            - 'curl -fsS -m 15 --retry 3 "$HEARTBEAT_URL"'
            resources:
              requests:
                cpu: 5m
                memory: 8Mi
              limits:
                memory: 32Mi
