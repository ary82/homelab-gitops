apiVersion: batch/v1
kind: CronJob
metadata:
  name: heartbeat
  namespace: monitoring
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 60
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: ping
            image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
            envFrom:
            - secretRef:
                name: healthchecks
            command:
            - "sh"
            - "-c"
            - 'curl -fsS -m 15 --retry 3 "$HEARTBEAT_URL"'
            resources:
              requests:
                cpu: 5m
                memory: 8Mi
              limits:
                memory: 32Mi
