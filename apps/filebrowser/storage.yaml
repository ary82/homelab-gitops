apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: filebrowser
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: documents
  namespace: filebrowser
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 10Gi
