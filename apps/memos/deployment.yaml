apiVersion: apps/v1
kind: Deployment
metadata:
  name: memos
  namespace: memos
spec:
  replicas: 1
  strategy: # SQLite: one writer
    type: Recreate
  selector:
    matchLabels:
      app: memos
  template:
    metadata:
      labels:
        app: memos
    spec:
      enableServiceLinks: false
      containers:
      - name: memos
        image: docker.io/neosmemo/memos:26.11.2@sha256:3c7bd779510403350465ecabb7e6fbc0887206f9d55b8decf51a205613fa5616
        env:
        - name: MEMOS_PORT
          value: "5230"
        - name: MEMOS_INSTANCE_URL
          value: "https://memos.sb.ary82.dev"
        - name: TZ
          value: Asia/Kolkata
        ports:
        - containerPort: 5230
        readinessProbe:
          tcpSocket:
            port: 5230
          initialDelaySeconds: 5
        livenessProbe:
          tcpSocket:
            port: 5230
          initialDelaySeconds: 30
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /var/opt/memos
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
---
apiVersion: v1
kind: Service
metadata:
  name: memos
  namespace: memos
spec:
  selector:
    app: memos
  ports:
  - port: 5230
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memos
  namespace: memos
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  rules:
  - host: memos.sb.ary82.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: memos
            port:
              number: 5230
  tls:
  - hosts:
    - memos.sb.ary82.dev
