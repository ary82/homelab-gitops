apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: "43.0.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    deployment:
      replicas: 1
    env:
    - name: PORKBUN_API_KEY
      valueFrom:
        secretKeyRef:
          name: porkbun-credentials
          key: api-key
    - name: PORKBUN_SECRET_API_KEY
      valueFrom:
        secretKeyRef:
          name: porkbun-credentials
          key: secret-key
    certificatesResolvers:
      letsencrypt:
        acme:
          email: acme@ary82.dev
          storage: /data/acme.json
          dnsChallenge:
            provider: porkbun
    persistence:
      enabled: true
      path: /data
      size: 128Mi
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 0
    accessLog:
      enabled: true
