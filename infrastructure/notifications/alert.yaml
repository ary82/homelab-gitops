apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: homelab
  namespace: flux-system
spec:
  providerRef:
    name: discord
  eventSeverity: info
  eventSources:
  - kind: GitRepository
    name: "*"
  - kind: Kustomization
    name: "*"
  - kind: HelmRepository
    name: "*"
  - kind: HelmRelease
    name: "*"
    namespace: traefik
  exclusionList:
  - "^Dependencies do not meet ready condition"
